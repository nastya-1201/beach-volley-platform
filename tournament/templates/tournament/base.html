{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Beach Volley Platform{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --surface: #ffffff;
            --surface-2: #f8fbff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: var(--text);
    background:
        linear-gradient(rgba(10, 20, 40, 0.68), rgba(10, 20, 40, 0.68)),
        url("{% static 'images/background.JPG' %}") center/cover fixed no-repeat;
}

        a {
            text-decoration: none;
        }

        .site-header {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            padding: 26px 0 18px;
            box-shadow: 0 10px 30px rgba(29, 78, 216, 0.2);

             position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        }

        .wrap {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brand-title {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.2px;
        }

        .brand-subtitle {
            margin: 0;
            color: rgba(255,255,255,0.88);
            font-size: 14px;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav a {
            color: white;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            transition: 0.2s ease;
            font-weight: bold;
            font-size: 14px;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-1px);
        }

        .page {
    padding: 150px 0 48px;
    min-height: calc(100vh - 120px);
}

        .hero {
            background: linear-gradient(135deg, #ffffff 0%, #f7faff 100%);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.7);
            margin-bottom: 24px;
        }

        .hero h1 {
            margin: 0 0 12px;
            font-size: 34px;
            line-height: 1.15;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
            max-width: 760px;
        }

        .section-title {
    margin: 0 0 18px;
    font-size: 30px;
    color: white;
}

        .grid {
            display: grid;
            gap: 18px;
        }

       .card {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    border: 1px solid rgba(255,255,255,0.4);
    backdrop-filter: blur(8px);
}

        .card h2, .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .card p {
            margin: 8px 0;
            color: var(--text);
        }

        .muted {
            color: var(--muted);
        }

        .link-title {
    color: #1e3a8a;
    transition: 0.2s ease;
    font-weight: 700;
}

.link-title:hover {
    color: #172554;
}

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #eaf2ff;
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .table-wrap {
    background: rgba(255, 255, 255, 0.94);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
}

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 16px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #eef4ff;
            color: #1e3a8a;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty {
            color: var(--muted);
        }

        .bracket-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .bracket-column-title {
            margin: 0 0 14px;
            font-size: 22px;
        }

        .match-box {
            background: white;
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid #edf2f7;
            margin-bottom: 16px;
        }

        .match-box h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .match-line {
            margin: 6px 0;
        }
        .player-name-link {
    color: #1e3a8a;
    text-decoration: none;
    font-weight: 700;
}

.player-name-link:hover {
    color: #172554;
    text-decoration: underline;
}
        @media (max-width: 700px) {
            .hero {
                padding: 22px;
            }

            .hero h1 {
    margin: 0 0 12px;
    font-size: 34px;
    line-height: 1.15;
    color: #1f2937;
}

            .section-title {
                font-size: 24px;
            }

            th, td {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <div class="header-top">
                <div class="brand">
                    <h1 class="brand-title">Beach Volley Platform</h1>
                    <p class="brand-subtitle">Платформа для ведения соревнований по пляжному волейболу</p>
                </div>

                <nav class="nav">
    <a href="/">Главная</a>
    <a href="/players/">Игроки</a>
    <a href="/tournaments/">Турниры</a>
    <a href="/courts/">Площадки</a>
    <a href="/admin/" style="background: rgba(255,255,255,0.18);">Администратор</a>
</nav>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="wrap">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
