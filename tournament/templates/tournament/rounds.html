{% extends 'tournament/base.html' %}

{% block title %}Туры{% endblock %}

{% block content %}
<h1>Список туров</h1>

{% for round in rounds %}
    <div class="card">
        <h2>{{ round.name }}</h2>
        <p><strong>Номер тура:</strong> {{ round.round_number }}</p>
    </div>
{% empty %}
    <div class="card">
        <p>Туры пока не добавлены.</p>
    </div>
{% endfor %}
{% endblock %}
