{% extends 'tournament/base.html' %}

{% block title %}Игроки{% endblock %}

{% block content %}
<h1 class="section-title">Список игроков</h1>

<form method="get" style="margin-bottom: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <input
        type="text"
        name="q"
        value="{{ query }}"
        placeholder="Поиск игрока..."
        style="padding: 12px; width: 280px; border-radius: 12px; border: 1px solid #ccc;"
    >
    <button
        type="submit"
        style="padding: 12px 18px; border: none; border-radius: 12px; background: #2563eb; color: white; font-weight: bold; cursor: pointer;"
    >
        Найти
    </button>
</form>

<div class="grid">
    {% for player in players %}
        <div class="card">
            <h2 style="margin: 0;">
                <a href="/players/{{ player.id }}/" class="player-name-link">
                    {{ player.first_name }} {{ player.last_name }}
                </a>
            </h2>
        </div>
    {% empty %}
        <div class="card">
            <p class="empty">Игроки не найдены.</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
